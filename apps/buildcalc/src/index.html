<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BuildCalc | Free Construction &amp; Home Improvement Calculators</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BuildCalc helps you estimate concrete, gravel, paint, tile, mulch, and square footage for home improvement and construction projects.">
  <meta name="theme-color" content="#f1f5ef">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('buildcalc-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
