<header class="site-header" (keydown.escape)="closeMenu()">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="BuildCalc home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M4 15.5 16 5l12 10.5v12H4z"/><path d="M12 27.5V17h8v10.5M4 15.5l12 11 12-11"/></svg></span>
      <span>Build<span>Calc</span></span>
    </a>
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="main-nav" aria-label="Toggle navigation">
      <span></span><span></span>
    </button>
    <nav id="main-nav" class="main-nav" [class.is-open]="menuOpen()" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/all-calculators" routerLinkActive="active" (click)="closeMenu()">Calculators</a>
      <a routerLink="/guides" routerLinkActive="active" (click)="closeMenu()">Material guides</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <label class="unit-preference"><span>Units</span><select [value]="units.system()" (change)="updateUnits($event)" aria-label="Preferred measurement system"><option value="us">US customary</option><option value="metric">Metric</option></select></label>
      <a class="button button-small" routerLink="/all-calculators" (click)="closeMenu()">All calculators <span aria-hidden="true">→</span></a>
    </nav>
  </div>
</header>
<main id="main" tabindex="-1">
  <router-outlet />
</main>
<p class="app-note">BuildCalc estimates are for planning purposes. Check quantities with your supplier and read the <a href="/disclaimer/">disclaimer</a>.</p>
